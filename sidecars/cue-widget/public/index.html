<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CUE split</title>
  <link rel="stylesheet" href="widget.css" />
</head>
<body>
  <div class="page" id="page">
    <h1 class="title" id="pageTitle">CUE split</h1>
    <div class="card">
      <div class="head">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="6" fill="#3d4d63"/>
          <circle cx="16" cy="16" r="9" fill="none" stroke="#dce4ee" stroke-width="2"/>
          <circle cx="16" cy="16" r="2.5" fill="#dce4ee"/>
        </svg>
        <div>
          <div class="name">shnsplit</div>
          <div class="sub">CUE + image FLAC → tagged tracks</div>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="stack" id="files"></div>
      <div class="list" id="tracks"></div>
      <div class="bar" id="bar" hidden><span style="width:0%"></span></div>
      <p class="log" id="log"></p>
      <p class="err" id="err" hidden></p>
      <div class="acts">
        <button class="btn primary" id="split" type="button">Split</button>
        <button class="btn" id="keep" type="button">Keep image</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
