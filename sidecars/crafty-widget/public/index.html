<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minecraft</title>
  <link rel="stylesheet" href="widget.css" />
</head>
<body>
  <div class="page" id="page">
    <h1 class="title">Minecraft</h1>
    <div class="card">
      <div class="head">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="6" fill="#3a7d44"/>
          <rect x="7" y="7" width="18" height="18" fill="#5d9c64"/>
          <rect x="10" y="10" width="5" height="5" fill="#2d5a33"/>
          <rect x="17" y="10" width="5" height="5" fill="#2d5a33"/>
          <rect x="10" y="17" width="12" height="5" fill="#2d5a33"/>
        </svg>
        <div>
          <div class="name">Crafty</div>
          <div class="sub" id="sub">loading…</div>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="list" id="list"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
